server.port=8081
#server.ssl.certificate=file:./ssl-selfsigned/cert.pem
#server.ssl.certificate-private-key=file:./ssl-selfsigned/key.pem

spring.application.name=backend

# Primary database: MySQL. Use profile "default" or "h2" to switch to H2 in-memory.
spring.profiles.active=mysql

# Fallback when not using mysql profile (e.g. tests / H2)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
# H2 console (optional, for debugging): http://localhost:8080/h2-console
spring.h2.console.enabled=true

# JWT
app.jwt.secret=your-256-bit-secret-change-in-production-make-it-long-enough
app.jwt.expiration-ms=86400000

# Email (configure for real SMTP; dev: logs only or use Mailtrap/Ethereal)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=bf92a80f61f042
spring.mail.password=fa421ed164b4e9
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Frontend base URL for verification links
app.frontend.url=http://localhost:4200

# Image upload (server storage; for testing; later can switch to cloud)
app.upload.image-dir=uploads/images
# Base URL for image links in responses (for QR / short link)
app.api.base-url=https://localhost:8081

# Swagger UI (when app is running): http://localhost:8081/swagger-ui.html

# Sign-in tracking: remove record after this many hours with no activity
app.signin.inactivity-hours=1
# How often to run cleanup (ms). Default 5 min
app.signin.cleanup-interval-ms=300000

# Wall: posts older than this many days are deleted (default 30)
app.wall.retention-days=30
# How often to run wall cleanup (ms). Default 24h
app.wall.cleanup-interval-ms=86400000
